<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Removal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 480px;">
        <div class="card shadow border-0 p-4 text-center">
            <h4 class="text-danger fw-bold mb-3">Confirm Deletion</h4>
            <p class="text-secondary mb-4">
                Are you sure you want to remove <strong>@{{ entry.username }}</strong> ({{ entry.email }}) from the waitlist?
            </p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Yes, Remove</button>
            </form>
            <a href="{% url 'waitlist_list' %}" class="btn btn-outline-secondary w-100 py-2 mt-2">Cancel</a>
        </div>
    </div>
</body>
</html>
